name: Release

# A `v*` tag builds every wheel and the sdist, uploads them to TestPyPI, then
# to PyPI (trusted publishing, no token). A manual run builds and tests only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

  build_wheels:
    name: Wheels on ${{ matrix.os }}
    needs: check_version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Options, including the smoke test run on each wheel, are in pyproject.toml.
      - uses: pypa/cibuildwheel@v4.3.1
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: check_version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv build --sdist
      - name: Smoke test the sdist (compiles the grammar)
        run: |
          uv venv --python 3.12 /tmp/sdist-venv
          VIRTUAL_ENV=/tmp/sdist-venv uv pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/ox --version
          /tmp/sdist-venv/bin/python -I tests/smoke.py examples/example.ox
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_testpypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ox-train
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish_testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ox-train
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
