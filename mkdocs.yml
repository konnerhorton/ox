site_name: ox
site_url: https://konnerhorton.github.io/ox
theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  icon:
    logo: material/dumbbell

# Process docs live under docs/ but aren't part of the user-facing site.
exclude_docs: |
  work/

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli-reference.md
  - Reports & Plugins: plugins.md
  - API Reference: api-reference.md
  - Editor Support: editor-support.md
  - Future Improvements: future.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences